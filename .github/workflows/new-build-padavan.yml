name: Build validated K2P firmware

on:
  workflow_dispatch:
  push:
    branches: [master, codex/k2p-maintenance-20261001]
    paths:
      - .github/workflows/new-build-padavan.yml
      - scripts/**
      - sources.lock.json

permissions:
  contents: read

concurrency:
  group: k2p-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.flavor }}
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        flavor: [k2p-4.4, k2p-susu]
    defaults:
      run:
        shell: bash
    env:
      FLAVOR: ${{ matrix.flavor }}
    steps:
      - name: Checkout build helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential bison flex gawk gettext texinfo git curl wget unzip \
            libtool-bin automake autopoint pkg-config gperf cmake fakeroot \
            kmod cpio python3 python3-docutils help2man xz-utils patch \
            zlib1g-dev libgmp-dev libmpc-dev libmpfr-dev libncurses5-dev \
            libltdl-dev libc6-i386 ca-certificates qemu-user

      - name: Check firmware validator
        run: python3 scripts/test_validate_firmware.py

      - name: Compile and validate K2P firmware
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          bash scripts/build_k2p.sh "$FLAVOR" 2>&1 | tee diagnostics/build.log

      - name: Upload validated firmware
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: K2P-${{ matrix.flavor }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logs-${{ matrix.flavor }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 30
